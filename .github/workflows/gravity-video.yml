name: Render gravity lesson
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: python -m pip install Pillow==11.3.0
      - run: python video_lessons/gravity/render.py
      - uses: actions/upload-artifact@v4
        with:
          name: Gravity-Lesson
          path: video_lessons/gravity/Gravity_Lesson.mp4
